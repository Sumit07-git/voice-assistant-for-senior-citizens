<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElderPal-Signup</title>
  <link rel="icon" href="logo1.png" type="image/png">
  <link rel="stylesheet" href="signup.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="signup-page">
    <div class="signup-container">
        <div class="signup-card">
            <div class="logo">
                <i class="fas fa-microphone-alt"></i>
                <h1>Create New Account</h1>
                <p>Join Elderpal Now</p>
            </div>

            <form id="signupForm" class="login-form">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="input-group">
                    <label for="username">Username*</label>
                    <input type="text" id="username" name="username" required>
                    <small class="input-help">*Choose a username you'll remember easily</small>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password*</label>
                    <input type="password" id="password" name="password" required>
                    <small class="input-help">*Atleast 6 characters required</small>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="signup-btn">
                    <i class="fa fa-user-plus"></i>
                    Create Account
                </button>
            </form>
            
            <div class="signup-footer">
                <p>Already have an account?</p>
                <a href="index.html" class="link-btn">
                    <i class="fas fa fa-sign-in-alt"></i>
                    Sign in Instead
                </a>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>

</body>
</html>
